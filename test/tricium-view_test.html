<meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=yes">
<title>tricium-view</title>

<script src="./bower_components/webcomponentsjs/webcomponents-lite.min.js"></script>
<script src="./bower_components/web-component-tester/browser.js"></script>

<link rel="import" href="./bower_components/iron-test-helpers/iron-test-helpers.html">
<link rel="import" href="../src/main/resources/static/tricium-view.html">

<test-fixture id="tricium-view-fixture">
  <template>
    <tricium-view></tricium-view>
  </template>
</test-fixture>

<script>
  suite('<tricium-view>', () => {
    let element;
    let sandbox;

    setup(() => {
      element = fixture('tricium-view-fixture');
      sandbox = sinon.sandbox.create();
    });

    teardown(() => {
      sandbox.restore();
    });

    test('_loggedIn initial state', () => {
      assert.isFalse(element._loggedIn);
    });

    test('_loggedIn after _handleAuthChange', () => {
      element._handleAuthChange({detail: {loggedIn: true}});
      assert.isTrue(element._loggedIn);
      element._handleAuthChange({detail: {}});
      assert.isFalse(element._loggedIn);
    });

    test('_refreshProgress uses exponential back-off', (done) => {
      sandbox.stub(element.$.client, 'getOAuthToken', () => Promise.resolve());
      sandbox.stub(element.$.client, 'getProgress', () => Promise.reject());
      const initialTimeoutMs = element._updateIntervalMs;
      element._refreshProgress().catch(() => {
        assert.isTrue(element._updateIntervalMs > 2 * initialTimeoutMs);
        done();
      });
    });

    test('_computeTitleText with empty list', () => {
      assert.equal('No Analyzers', element._computeTitleText([]));
    });

    test('_computeTitleText with non-empty list', () => {
      assert.equal('Analyzers', element._computeTitleText([{analyzer: 'Hi'}]));
    });

    test('_getAnalyzerRunClass with valid states', () => {
      assert.equal('pending', element._getAnalyzerRunClass({state: 'PENDING'}));
      assert.equal('running', element._getAnalyzerRunClass({state: 'RUNNING'}));
      assert.equal('success', element._getAnalyzerRunClass({state: 'SUCCESS'}));
      assert.equal('failure', element._getAnalyzerRunClass({state: 'FAILURE'}));
    });

    test('_getAnalyzerRunClass with an invalid state', () => {
      assert.equal('', element._getAnalyzerRunClass({state: 'BOGUS'}));
    });
  });
</script>
