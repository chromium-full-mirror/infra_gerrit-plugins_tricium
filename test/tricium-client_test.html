<meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=yes">
<title>tricium-client</title>

<script src="./bower_components/webcomponentsjs/webcomponents-lite.min.js"></script>
<script src="./bower_components/web-component-tester/browser.js"></script>

<link rel="import" href="./bower_components/iron-test-helpers/iron-test-helpers.html">
<link rel="import" href="../src/main/resources/static/tricium-client.html">

<test-fixture id="tricium-client-fixture">
  <template>
    <tricium-client></tricium-client>
  </template>
</test-fixture>

<script>
  suite('<tricium-client> oauth-related behavior', () => {
    let element;

    setup(() => {
      element = fixture('tricium-client-fixture');
    });

    teardown(() => {
    });

    function nowSeconds() {
      return ~~(Date.now() / 1000);
    }

    test('_oauthTokenIsValid with valid token', () => {
      assert.isTrue(element._oauthTokenIsValid({
        access_token: 'foo',
        expires_at: (nowSeconds() + 3600) + '',
      }));
    });

    test('_oauthTokenIsValid with no access_token field', () => {
      assert.isFalse(element._oauthTokenIsValid({
        expires_at: (nowSeconds() + 3600) + '',
      }));
    });

    test('_oauthTokenIsValid with expired token', () => {
      assert.isFalse(element._oauthTokenIsValid({
        access_token: 'foo',
        expires_at: (nowSeconds() - 5) + '',
      }));
    });

    test('_oauthTokenIsValid with invalid values', () => {
      assert.isFalse(element._oauthTokenIsValid(null));
      assert.isFalse(element._oauthTokenIsValid(undefined));
      assert.isFalse(element._oauthTokenIsValid({access_token: 'foo'}));
    });
  });

  suite('<tricium-client> rpc request behavior', () => {
    let element;
    let server;

    const change = {
      id: 'myProject~master~I3ea943139cb62e86071996f2480e58bf3eeb9dd2',
      project: 'myProject',
      branch: 'master',
      subject: 'Implement Feature X',
    };

    const revision = {
      kind: 'REWORK',
      ref: 'refs/changes/99/4799/2',
      subject: 'My Patchset',
    };

    setup(() => {
      element = fixture('tricium-client-fixture');
      element.triciumHost = 'tricium-mock.appspot.com';
      sinon.stub(window, 'fetch');
    });

    teardown(() => {
      window.fetch.restore();
    });

    test('getProgress success', () => {
      const okResponseHeaders = {
        'Content-Type': 'application/json',
        'X-Prpc-Grpc-Code': '0',
      };
      const prefix = ')]}\'';
      const successResponse = {
        runId: '56511',
        state: 'SUCCESS',
        analyzerProgress: [
          {
            analyzer: 'GitFileIsolator',
            state: 'SUCCESS',
            swarmingUrl: 'https://swarm.example.com',
            swarmingTaskId: '390a',
          },
          {
            analyzer: 'Spacey',
            state: 'SUCCESS',
            swarmingUrl: 'https://swarm.example.com',
            swarmingTaskId: '390b',
            numComments: 2,
          },
        ],
      };
      const response = new window.Response(prefix + JSON.stringify(successResponse), {
        status: 200,
        headers: okResponseHeaders,
      });
      window.fetch.returns(Promise.resolve(response));
      const promise = element.getProgress(change, revision);
      promise.then((response) => {
        assert.deepEqual(response, successResponse.analyzerProgress);
      }).catch((error) => {
        assert.fail('Promise should not reject.');
      });
    });

    test('getProgress with error response', () => {
      const response = new window.Response('Invalid Argument', {
        status: 400,
        headers: {'X-Prpc-Grpc-Code': '3'},
      });
      window.fetch.returns(Promise.resolve(response));
      element.getProgress(change, revision).then((response) => {
        assert.fail('Promise should reject.');
      }).catch((error) => {
        assert.equal(error, 'X-Prpc-Grpc-Code: 3\nBody: Invalid Argument');
      });
    });

    test('getProgress with invalid response', () => {
      const response = new window.Response('No pRPC code', {
        status: 400,
      });
      window.fetch.returns(Promise.resolve(response));
      element.getProgress(change, revision).then((response) => {
        assert.fail('Promise should reject.');
      }).catch((error) => {
        assert.equal(error, 'X-Prpc-Grpc-Code: null\n' +
            'HTTP status: 400\nBody: No pRPC code');
      });
    });
  });
</script>
