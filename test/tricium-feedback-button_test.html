<meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=yes">
<title>tricium-view</title>

<script src="./bower_components/webcomponentsjs/webcomponents-lite.js"></script>
<script src="./bower_components/web-component-tester/browser.js"></script>

<link rel="import" href="./bower_components/iron-test-helpers/iron-test-helpers.html">
<link rel="import" href="../src/main/resources/static/tricium-feedback-button.html">

<test-fixture id="tricium-feedback-button-fixture">
  <template>
    <tricium-feedback-button></tricium-feedback-button>
  </template>
</test-fixture>

<script>
  suite('<tricium-feedback-button>', () => {
    let element;
    let sandbox;

    const exampleComment = {
      id: '1234_abcd',
      robot_run_id: '2345',
      robot_id: 'Spacey/Mixed',
      author: {name: 'Tricium'},
      properties: {tricium_comment_uuid: 'abcd1234-abcd1234'},
    };

    const exampleResponse = {
      issue: 'crbug.com/4321',
    };

    setup(() => {
      element = fixture('tricium-feedback-button-fixture');
      element.view = {
        $: {client: {reportNotUseful() { throw Error('should be stubbed'); }}},
      };
      sandbox = sinon.sandbox.create();
    });

    teardown(() => {
      sandbox.restore();
    });

    test('tricium-feedback-button checks comment author', () => {
      element.comment = {
        author: {name: 'Tricium (dev)'},
      };
      assert.isTrue(element.disabled);
    });

    test('reportNotUseful delegates to tricium-view', (done) => {
      sandbox.stub(element.view.$.client, 'reportNotUseful', (comment) => {
        assert.equal(comment, exampleComment);
        return Promise.resolve(exampleResponse);
      });
      element.comment = exampleComment;
      element.disabled = false;
      element.reportNotUseful().then((response) => {
        assert.equal(response, exampleResponse);
        done();
      }).catch((err) => {
        done(err);
      });
    });
  });
</script>
