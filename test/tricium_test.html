<meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=yes">
<title>tricium.js</title>

<script src="./bower_components/web-component-tester/browser.js"></script>
<script src="../src/main/resources/static/tricium.js"></script>

<script>
  suite('TriciumPlugin', () => {
    let plugin;
    let sandbox;
    let pluginStub;

    setup(() => {
      window.Polymer = {
        Base: {
          importHref() { throw Error('not stubbed'); },
        },
      };
      sandbox = sinon.sandbox.create();
      pluginStub = {
        on: () => { throw Error('not stubbed'); },
        url: () => { throw Error('not stubbed'); },
      };
      plugin = new __TriciumPlugin(pluginStub);
      assert.ok(plugin);
    });

    teardown(() => {
      sandbox.restore();
    });

    test('addEventListeners adds listener for showchange', (done) => {
      sandbox.stub(pluginStub, 'on', (eventName) => {
        assert.equal(eventName, 'showchange');
        done();
      });
      plugin.addEventListeners();
    });

    test('loadElement uses importHref to load tricium-view', (done) => {
      sandbox.stub(pluginStub, 'url', (path) => {
        return 'https://www.example.com' + path;
      });
      sandbox.stub(Polymer.Base, 'importHref', (url, resolve, reject) => {
        assert.equal(url, 'https://www.example.com/static/tricium-view.html');
        done();
      });
      plugin.loadElement();
    });

    test('handleShowChange loads and initializes the element', (done) => {
      sandbox.stub(plugin, 'loadElement', () => Promise.resolve());
      const change = {rev: 'arbitrary'};
      const revision = {_number: 1};
      const elementStub = {reload: () => { throw Error('not stubbed'); }};
      const createElementStub = sandbox.stub(
          plugin, 'createElement', () => elementStub);
      const configureElementStub = sandbox.stub(plugin, 'configureElement');
      const appendElementToPageStub = sandbox.stub(
          plugin, 'appendElementToPage');

      const reloadStub = sandbox.stub(elementStub, 'reload', () => {
        assert.isTrue(createElementStub.calledOnce);
        assert.isTrue(configureElementStub.calledOnce);
        assert.isTrue(configureElementStub.calledWith(change, revision));
        assert.isTrue(appendElementToPageStub.calledOnce);
        assert.isTrue(reloadStub.calledOnce);
        done();
      });

      plugin.handleShowChange(change, revision);
    });

    test('createElement sets the plugin object', () => {
      const el = {};
      sandbox.stub(document, 'createElement', () => el);
      plugin.createElement();
      assert.deepEqual(el.plugin, pluginStub);
    });

    test('configureElement sets the change and revision properties', () => {
      const pluginStub = sandbox.stub();
      pluginStub._element = {};
      const change = {
        _number: 1234,
        project: 'fake project',
      };
      const revision = {_number: 42};
      plugin.configureElement.call(pluginStub, change, revision);
      assert.deepEqual(pluginStub._element.revision, revision);
      assert.deepEqual(pluginStub._element.change, change);
    });
  });
</script>
