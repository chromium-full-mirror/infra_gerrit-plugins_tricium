<title>Example static tricium-view element</title>

<!-- This should import the same version of Polymer that Gerrit will use. -->
<link rel="import" href="http://polygit.org/polymer+v1.11.2/components/polymer/polymer.html">

<link rel="import" href="../src/main/resources/static/tricium-view.html">

<style>
/* This style is added here to approximately match style used in PolyGerrit. */
:root {
  --default-horizontal-margin: 1rem;
  --font-family: 'Roboto', sans-serif;
  --font-family-bold: 'Roboto Medium', sans-serif;
}
body {
  height: 100%;
  font-size: 13px;
  font-family: var(--font-family);
  line-height: 1.4;
}
*, *::after, *::before {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
h3 {
  font-size: 1.17em;
  font-family: var(--font-family-bold);
}
</style>

<h1>Example tricium-view element</h1>
<p>This page can be used to show what the tricium-view element looks like with
canned example results. Usage: start a local static HTTP server and navigate to
this file.</p>

<tricium-view id="view"></tricium-view>

<script>
'use strict';

const fakePlugin = {
  restApi() {
    return {
      get(url) {
        return Promise.resolve({});
      },
      getLoggedIn() {
        return Promise.resolve(false);
      },
    };
  },
  getPluginName() {
    return 'tricium';
  },
};

const view = document.getElementById('view');
view.triciumHost = 'tricium-dev.appspot.com';
view.plugin = fakePlugin;
view._results = [
  {
    name: 'GitFileIsolator',
    swarmingUrl: 'http://example.com',
    swarmingTaskId: '1',
    state: 'SUCCESS',
    numComments: 0,
  },
  {
    name: 'NotFinished',
    swarmingUrl: 'http://example.com',
    swarmingTaskId: '2',
    state: 'RUNNING',
    numComments: 0,
  },
  {
    name: 'NotStarted',
    swarmingUrl: 'http://example.com',
    swarmingTaskId: '3',
    state: 'PENDING',
    numComments: 0,
  },
  {
    name: 'Broken',
    swarmingUrl: 'http://example.com',
    swarmingTaskId: '4',
    state: 'FAILURE',
    numComments: 0,
  },
  {
    name: 'MyLinter',
    swarmingUrl: 'http://example.com',
    swarmingTaskId: '5',
    state: 'SUCCESS',
    numComments: 3,
  },
];

/*
 * Development test function to use to get the tricium-view to fetch
 * and display results for a particular example change and patchset.
 */
function useExampleChange() {
  view.$.client._getGerritHost = () => 'chromium-review.googlesource.com';
  view.$.client.triciumHost = 'tricium-dev.appspot.com';
  view.change = {
    project: 'playground/gerrit-tricium',
    id: 'playground%2Fgerrit-tricium~master~' +
        'I8e47bf64136257d50489936f21a24c86782992e2',
  };
  view.revision = {
    ref: 'refs/changes/43/881643/6',
    _number: 6,
  };
  view._refreshProgress();
}

</script>
