<dom-module id="tricium-feedback-button">
  <template>
    <style>
      #buglink {
        color: var(--link-color);
      }
    </style>
    <gr-button
        class="action"
        on-tap="reportNotUseful"
        disabled$="[[disabled]]"
        link>[[buttonText]]</gr-button>
    <a id="buglink" href="[[bugLinkURL]]" target="_blank" hidden>File a Bug</a>
  </template>
  <script src="tricium-feedback-button.js"></script>
</dom-module>
