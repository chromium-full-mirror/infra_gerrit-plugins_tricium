<link rel="import" href="./tricium-client.html">
<dom-module id="tricium-feedback-button">
  <template>
    <style>
      #buglink {
        color: var(--link-color);
      }
    </style>
    <gr-button
        class="action"
        on-tap="reportNotUseful"
        disabled$="[[disabled]]"
        link>[[buttonText]]</gr-button>
    <a id="buglink"
      href="https://bugs.chromium.org/p/chromium/issues/entry?components=Infra%3EPlatform%3ETricium"
      hidden>File a Bug</a>
    <tricium-client
        id="client"
        tricium-host="[[triciumHost]]"
        plugin="[[plugin]]"></tricium-client>
  </template>
  <script src="tricium-feedback-button.js"></script>
</dom-module>
