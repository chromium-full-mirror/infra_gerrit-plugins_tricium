<script src="https://apis.google.com/js/platform.js"></script>

<script src="./promises.js"></script>
<script src="./auth.js"></script>
<script src="./tricium-client.js"></script>

<link rel="import" href="tricium-view.html">
<link rel="import" href="tricium-feedback-button.html">

<script>
(function() {
  'use strict';

  Gerrit.install((plugin) => {
    if (!window.Polymer) { return; } // Only supported in PolyGerrit.

    window.tricium.initAuth(plugin);
    plugin.registerCustomComponent(
        'change-view-integration', 'tricium-view');
    plugin.registerCustomComponent(
        'robot-comment-controls', 'tricium-feedback-button');
  });
})();
</script>
