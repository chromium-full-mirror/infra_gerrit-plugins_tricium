<link rel="import" href="./tricium-client.html">
<dom-module id="tricium-view">
  <template>
    <style>
      #view-container {
        display: block;
        margin: 1em 0;
      }
      .container {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
      }
      .header {
        background-color: #fafafa;
        justify-content: space-between;
        min-height: 3.2em;
        padding: .5em var(--default-horizontal-margin, 1rem);
        border-top: 1px solid #ddd;
        border-bottom: 1px solid #ddd;
      }
      .header .label {
        font: inherit;
        font-family: var(--font-family-bold);
        font-size: 1.17em;
        margin-right: 1em;
      }
      .header .update {
        color: rgba(0, 0, 0, .7);
      }
      .num-comments-chip {
        border: #777 1px solid;
        margin-left: .45em;
        padding: 0 .2em;
        background: lightgreen;
        text-decoration: none;
      }
      .functions-section {
        display: flex;
        flex-wrap: wrap;
        padding: 0;
      }
      .function {
        border: 1px solid #ccc;
        display: flex;
        font-size: .9em;
        margin: 0.5em;
        overflow: hidden;
        padding: .45em 1.35em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .function.pending {
        background-color: #e0e0e0;
      }
      .function.running {
        background-color: #ffeb3b;
      }
      .function.success {
        background-color: #8bc34a;
      }
      .function.failure {
        background-color: #f44336;
        color: #fff;
      }
      .function .title {
        color: #000;
        text-decoration: none;
      }
      .function.failure .title {
        color: #fff;
      }
      .function .title:hover {
        text-decoration: underline;
      }
      .function .title::before {
        background-position: center;
        background-repeat: no-repeat;
        background-size: 12px;
        content: ' ';
        display: block;
        height: 1em;
        width: 1em;
        margin-left: -1.2em;
        margin-top: .25em;
        position: absolute;
      }
      .function.pending .title::before {
        background-image: url("https://www.gstatic.com/images/icons/material/system/1x/more_horiz_black_18dp.png");
      }
      .function.running .title::before {
        background-image: url("https://www.gstatic.com/images/icons/material/system/1x/more_horiz_black_18dp.png");
      }
      .function.success .title::before {
        background-image: url("https://www.gstatic.com/images/icons/material/system/1x/check_black_18dp.png");
      }
      .function.failure .title::before {
        background-image: url("https://www.gstatic.com/images/icons/material/system/1x/close_black_18dp.png");
      }
    </style>
    <template is="dom-if" if="[[triciumHost]]">
      <div id="view-container" hidden$="[[_loading]]">
        <div class="header container">
          <div class="container">
            <h3 class="label">[[_computeTitleText(_results)]]</h3>
            <div class="update">
              [[_computePatchsetDescription(revision)]]
              [[_computeUpdateText(_lastUpdate)]]
            </div>
          </div>
        </div>
        <section class="functions-section">
          <template is="dom-repeat" items="[[_results]]" as="result">
            <div class$="function [[_getFunctionClass(result)]]">
              <a class="title"
                  aria-label$="[[result.name]] [[_getFunctionClass(result)]]"
                  href$="[[_getFunctionUrl(result)]]" target="_blank">
                [[result.name]]
              </a>
              <span class="num-comments-chip"
                  hidden$="[[!result.numComments]]"
                  alt="Produced [[result.numComments]] comments."
                  title="Produced [[result.numComments]] comments.">
                [[result.numComments]]
              </span>
            </div>
          </template>
        </section>
      </div>
    </template>
    <tricium-client id="client"
        tricium-host="[[triciumHost]]" plugin="[[plugin]]"
        on-auth-change="_handleAuthChange"></tricium-client>
  </template>
  <script src="tricium-view.js"></script>
</dom-module>
