<link rel="import" href="./tricium-client.html">
<dom-module id="tricium-view">
  <template>
    <style>
      #view-container {
        display: block;
      }
      .container {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
      }
      .header {
        background-color: var(--table-header-background-color);
        justify-content: space-between;
        min-height: 3.2em;
        padding: .5em var(--default-horizontal-margin, 1rem);
        border-top: 1px solid var(--border-color);
        border-bottom: 1px solid var(--border-color);
      }
      .header .label {
        font: inherit;
        font-family: var(--font-family-bold);
        font-size: 1.17em;
        margin-right: 1em;
      }
      .header a {
        color: var(--link-color);
      }
    </style>
    <template is="dom-if" if="[[triciumHost]]">
      <div id="view-container" hidden$="[[_hidden]]">
        <div class="header container">
          <div class="container">
            <h3 class="label">[[_computeTitleText(_response)]]</h3>
            <a href="[[_computeRunURL(_response)]]"
               hidden$="[[!_computeRunURL(_response)]]">
              [[_computeRunText(_response)]]
            </a>
          </div>
          <div class="container">
              <a href="https://chromium.googlesource.com/infra/infra/+/master/go/src/infra/tricium">More info</a> /
              <a href="https://bugs.chromium.org/p/chromium/issues/entry?components=Infra%3EPlatform%3ETricium">File bug</a>
          </div>
        </div>
      </div>
    </template>
    <tricium-client id="client"
        tricium-host="[[triciumHost]]" plugin="[[plugin]]"
        on-auth-change="_handleAuthChange"></tricium-client>
  </template>
  <script src="tricium-view.js"></script>
</dom-module>
