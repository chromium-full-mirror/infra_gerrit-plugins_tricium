<dom-module id="tricium-view">
  <template>
    <style>
      #view-container {
        display: block;
      }
      .container {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
      }
      /*
       * This style is meant to roughly emulate the style of header bars like
       * gr-file-list-header (https://bit.ly/2KODMjb) in PolyGerrit.
       */
      .header {
        background-color: var(--table-header-background-color);
        justify-content: space-between;
        padding: .5em var(--default-horizontal-margin, 1rem);
        border-top: 1px solid var(--border-color);
        border-bottom: 1px solid var(--border-color);
      }
      .header .label {
        font: inherit;
        font-weight: var(--font-weight-bold);
        font-size: 1.17em;
        margin: 0 1em 0 0;
      }
      .header a {
        color: var(--link-color);
      }
    </style>
    <template is="dom-if" if="[[triciumHost]]">
      <div id="view-container" hidden$="[[_hidden]]">
        <div class="header container">
          <div class="container">
            <h3 class="label">[[_computeTitleText(_response)]]</h3>
            <a href="[[_computeRunURL(_response)]]" target="_blank"
               hidden$="[[!_computeRunURL(_response)]]">
              [[_computeRunText(_response)]]
            </a>
          </div>
          <div class="container">
            <gr-button link on-tap="_handleFileBugTap">File Bug</gr-button>
          </div>
        </div>
      </div>
    </template>
  </template>
  <script src="tricium-view.js"></script>
</dom-module>
