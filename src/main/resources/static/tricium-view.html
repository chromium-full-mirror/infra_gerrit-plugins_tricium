<link rel="import" href="./tricium-client.html">
<dom-module id="tricium-view">
  <template>
    <style>
      #view-container {
        border: 1px solid #ddd;
        display: block;
        margin: 1em 0;
      }
      .container {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
      }
      .header {
        background-color: #fafafa;
        border-bottom: 1px solid #ddd;
        justify-content: space-between;
        min-height: 3.2em;
        padding: .5em var(--default-horizontal-margin, 1rem);
      }
      .header .label {
        font: inherit;
        font-family: var(--font-family-bold);
        font-size: 1.17em;
        margin-right: 1em;
      }
      .header .update {
        color: rgba(0, 0, 0, .7);
      }
      .analyzers-section {
        display: flex;
        flex-wrap: wrap;
        padding: .5em 0 0 .5em;
      }
      .analyzer {
        border: 1px solid #ccc;
        display: flex;
        font-size: .9em;
        margin: 0 .5em .5em 0;
        overflow: hidden;
        padding: .45em 1.35em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .analyzer.pending {
        background-color: #e0e0e0;
      }
      .analyzer.running {
        background-color: #ffeb3b;
      }
      .analyzer.success {
        background-color: #8bc34a;
      }
      .analyzer.failure {
        background-color: #f44336;
        color: #fff;
      }
      .analyzer .title {
        color: #000;
        text-decoration: none;
      }
      .analyzer.failure .title {
        color: #fff;
      }
      .analyzer .title:hover {
        text-decoration: underline;
      }
      .analyzer .title::before {
        background-position: center;
        background-repeat: no-repeat;
        background-size: 12px;
        content: ' ';
        display: block;
        height: 1em;
        width: 1em;
        margin-left: -1.2em;
        margin-top: .25em;
        position: absolute;
      }
      .analyzer.pending .title::before {
        background-image: url("https://www.gstatic.com/images/icons/material/system/1x/more_horiz_black_18dp.png");
      }
      .analyzer.running .title::before {
        background-image: url("https://www.gstatic.com/images/icons/material/system/1x/more_horiz_black_18dp.png");
      }
      .analyzer.success .title::before {
        background-image: url("https://www.gstatic.com/images/icons/material/system/1x/check_black_18dp.png");
      }
      .analyzer.failure .title::before {
        background-image: url("https://www.gstatic.com/images/icons/material/system/1x/close_black_18dp.png");
      }
    </style>
    <template is="dom-if" if="[[baseUrl]]">
      <div id="view-container" hidden$="[[_loading]]">
        <div class="header container">
          <div class="container">
            <h3 class="label">[[_computeTitleText(_analyzerResults)]]</h3>
            <div class="update">[[_computeUpdateText(_lastUpdate)]]</div>
          </div>
        </div>
        <section class="analyzers-section">
          <template is="dom-repeat" items="[[_analyzerResults]]" as="result">
            <div class$="analyzer [[_getAnalyzerClass(result)]]">
               <a class="title"
                  aria-label$="[[result.analyzer]] [[_getAnalyzerClass(result)]]"
                  href$="[[_getAnalyzerUrl(result)]]" target="_blank">
                  [[result.analyzer]]</a>
            </div>
          </template>
        </section>
      </div>
    </template>
    <tricium-client id="client"
        base-url="[[baseUrl]]" plugin="[[plugin]]"
        on-auth-change="_handleAuthChange"></tricium-client>
  </template>
  <script src="tricium-view.js"></script>
</dom-module>
